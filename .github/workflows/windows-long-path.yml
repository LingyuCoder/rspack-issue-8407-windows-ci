name: Windows long-path verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.case }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: legacy-repro
            rspack: "1.1.8"
            rsbuild: "1.1.13"
            expected: panic
          - case: latest-v1
            rspack: "1.7.12"
            rsbuild: "1.7.6"
            expected: success
          - case: current-v2
            rspack: "2.2.2"
            rsbuild: "2.2.3"
            expected: success

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create the long-path reproduction
        shell: pwsh
        env:
          RSPACK_VERSION: ${{ matrix.rspack }}
          RSBUILD_VERSION: ${{ matrix.rsbuild }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          # Match a default Windows installation, where Win32 long paths are disabled.
          # Newly spawned Node.js processes observe this registry value.
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled `
            -Value 0

          $sourceRepo = "C:\rspack-repro"
          $segments = (1..18 | ForEach-Object { "0123456789" }) -join "\"
          $deepRoot = Join-Path $sourceRepo $segments
          $appPath = Join-Path $deepRoot "app"

          git -c core.longpaths=true clone `
            --depth 1 `
            --branch bug-repro `
            https://github.com/Xellon/rspack-repro.git `
            $sourceRepo
          if ($LASTEXITCODE -ne 0) {
            throw "Cloning the original reproduction failed."
          }

          # Preserve the original package.json and lockfile for the legacy case.
          # Current cases update only the three packages under test.
          if ($env:EXPECTED -eq "success") {
            $packagePath = Join-Path $appPath "package.json"
            $packageJson = Get-Content $packagePath -Raw | ConvertFrom-Json
            $packageJson.dependencies.'@rspack/cli' = $env:RSPACK_VERSION
            $packageJson.dependencies.'@rspack/core' = $env:RSPACK_VERSION
            $packageJson.devDependencies.'@rsbuild/core' = $env:RSBUILD_VERSION
            $packageJson | ConvertTo-Json -Depth 20 | Set-Content -Path $packagePath -Encoding utf8NoBOM
          }

          "DEEP_ROOT=$deepRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_PATH=$appPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $longPaths = (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem").LongPathsEnabled
          Write-Host "Windows: $([Environment]::OSVersion.VersionString)"
          Write-Host "LongPathsEnabled: $longPaths"
          Write-Host "App path length: $($appPath.Length)"
          Write-Host "App path: $appPath"
          node --version
          pnpm --version

          "Windows: $([Environment]::OSVersion.VersionString)" >> $env:GITHUB_STEP_SUMMARY
          "LongPathsEnabled: $longPaths" >> $env:GITHUB_STEP_SUMMARY
          "App path length: $($appPath.Length)" >> $env:GITHUB_STEP_SUMMARY
          "App path: ``$appPath``" >> $env:GITHUB_STEP_SUMMARY

      - name: Install dependencies
        shell: pwsh
        env:
          EXPECTED: ${{ matrix.expected }}
        run: |
          Push-Location $env:DEEP_ROOT
          if ($env:EXPECTED -eq "panic") {
            pnpm install --frozen-lockfile
          } else {
            pnpm install --no-frozen-lockfile
          }
          $installExitCode = $LASTEXITCODE
          Pop-Location

          if ($installExitCode -ne 0) {
            throw "pnpm install failed with exit code $installExitCode"
          }

      - name: Build and verify expected result
        shell: pwsh
        env:
          EXPECTED: ${{ matrix.expected }}
          CASE_NAME: ${{ matrix.case }}
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP "$env:CASE_NAME.log"

          Push-Location $env:APP_PATH
          $previousErrorPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          pnpm exec rsbuild build *>&1 | Tee-Object -FilePath $logPath
          $buildExitCode = $LASTEXITCODE
          $ErrorActionPreference = $previousErrorPreference
          Pop-Location

          $log = Get-Content $logPath -Raw
          $panicked = $log -match "Panic occurred at runtime|Message:\s+should have module|should have module.*execute\.rs"

          "Build exit code: $buildExitCode" >> $env:GITHUB_STEP_SUMMARY
          "Detected reported panic: $panicked" >> $env:GITHUB_STEP_SUMMARY

          if ($env:EXPECTED -eq "panic") {
            if ($buildExitCode -eq 0) {
              throw "Legacy Rspack unexpectedly succeeded, so this environment did not reproduce issue #8407."
            }
            if (-not $panicked) {
              throw "Legacy Rspack failed, but did not reproduce the reported 'should have module' panic."
            }
          } else {
            if ($buildExitCode -ne 0) {
              throw "Current Rspack failed with exit code $buildExitCode."
            }
            if ($panicked) {
              throw "Current Rspack emitted the reported panic despite returning success."
            }
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.case }}-build-log
          path: ${{ runner.temp }}/${{ matrix.case }}.log
          if-no-files-found: warn
